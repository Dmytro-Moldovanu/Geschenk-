* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; min-height: 100vh; background: #fffaf1; }
button, input, select, textarea { font: inherit; }
button, label { -webkit-tap-highlight-color: transparent; }

:root {
  --ink: #202233;
  --muted: #62677c;
  --line: #dfd9cf;
  --paper: #fffdf8;
  --cream: #f8f5ef;
  --yellow: #ffd72f;
  --orange: #ff9a41;
  --coral: #ff7565;
  --blue: #6578eb;
  --purple: #8365d9;
  --radius-lg: 28px;
  --shadow: 0 16px 42px rgba(37, 33, 63, .12);
}

.app-shell { position: relative; min-height: 100vh; overflow: hidden; isolation: isolate; }
.app-shell > .site-header, .app-shell > main, .app-shell > footer { position: relative; z-index: 1; }

/* Decorative page background. Its only input is the normalized scroll position. */
.gift-background {
  position: fixed;
  z-index: 0;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(circle at 4% 16%, rgba(255, 215, 47, .2) 0 9%, transparent 25%),
    radial-gradient(circle at 96% 38%, rgba(101, 120, 235, .15) 0 8%, transparent 24%),
    radial-gradient(circle at 19% 91%, rgba(255, 117, 101, .12) 0 9%, transparent 26%),
    linear-gradient(135deg, #fffaf1 0%, #f8f4ff 48%, #fff8ed 100%);
}
.gift-background::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: .45;
  background-image: radial-gradient(rgba(68, 59, 113, .16) .85px, transparent .85px);
  background-size: 25px 25px;
  -webkit-mask-image: linear-gradient(90deg, #000, transparent 34%, transparent 72%, #000);
  mask-image: linear-gradient(90deg, #000, transparent 34%, transparent 72%, #000);
}
.background-blob { position: absolute; border-radius: 50%; filter: blur(1px); }
.background-blob-one {
  width: 340px;
  height: 340px;
  top: 12%;
  left: -190px;
  border: 44px solid rgba(255, 154, 65, .12);
  transform: translateY(calc(var(--enhanced-background-scroll) * 190px)) rotate(calc(var(--enhanced-background-scroll) * 90deg));
}
.background-blob-two {
  width: 250px;
  height: 250px;
  right: -130px;
  top: 53%;
  background: rgba(131, 101, 217, .08);
  transform: translateY(calc(var(--enhanced-background-scroll) * -160px));
}
.background-blob-three {
  width: 180px;
  height: 180px;
  left: 16%;
  bottom: -100px;
  background: rgba(255, 215, 47, .13);
  transform: scale(calc(1 + var(--enhanced-background-scroll) * .45));
}

.scroll-gift {
  position: absolute;
  z-index: 2;
  top: clamp(220px, 36vh, 390px);
  left: max(-126px, calc((100vw - 1180px) / 2 - 296px));
  width: 224px;
  height: 272px;
  opacity: .96;
  will-change: transform;
  transform: translateY(calc(var(--enhanced-background-scroll) * 105px)) rotate(calc(-5deg + var(--enhanced-background-scroll) * 12deg));
  transform-origin: 50% 100%;
}

  content: '';
  position: absolute;
  z-index: 0;
  left: 14px;
  right: 4px;
  bottom: -20px;
  height: 46px;
  border-radius: 50%;
  opacity: calc(.18 + var(--enhanced-gift-open) * .13);
  background: rgba(69, 49, 119, .2);
  filter: blur(13px);
  transform: scaleX(calc(1 - var(--enhanced-gift-open) * .15));
}

    <script>// Kompatibilitätsschicht für die eigenständige HTML-Version.
// Die bearbeitbare React-Implementierung befindet sich in src/components/GiftBackground.tsx.
// Diese Datei ergänzt die bereits erstellte Offline-Version.
(() => {
  'use strict'
  const root = document.documentElement
  const colors = ['#ffd339', '#ff718b', '#6479f4', '#8d65dc', '#ff9b45', '#40c8bb', '#f16ab8', '#52b2ed', '#ffdc7c', '#9ac95f']
  const symbols = ['★', '♥', '✦', '✧']
  const rand = (seed) => {
    const n = Math.sin(seed * 127.1 + 78.233) * 43758.5453123
    return n - Math.floor(n)
  }
  const clamp = (n) => Math.min(Math.max(n, 0), 1)
  const smooth = (from, to, n) => {
    const x = clamp((n - from) / (to - from))
    return x * x * (3 - 2 * x)
  }
  const style = (vars) => Object.entries(vars).map(([key, value]) => `${key}:${value}`).join(';')
  let frame = 0
  let initialized = false

  function initialize() {
    if (initialized) return true
    const bg = document.querySelector('.gift-background')
    if (!bg) return false
    initialized = true
    bg.classList.add('gift-background--enhanced')

    const rays = Array.from({ length: 24 }, (_, i) => {
      const angle = -166 + i * (318 / 23)
      return `<span class="gift-light-ray" style="${style({
        '--ray-angle': `${angle.toFixed(2)}deg`,
        '--ray-length': `${(350 + rand(i + 190) * 1050).toFixed(0)}px`,
        '--ray-thickness': `${(5 + rand(i + 480) * 15).toFixed(1)}px`,
        '--ray-delay': (rand(i + 230) * .17).toFixed(3),
        '--ray-color': colors[i % colors.length],
      })}"></span>`
    }).join('')

    const streams = Array.from({ length: 18 }, (_, i) => `<span class="gift-color-stream" style="${style({
      '--stream-angle': `${(-65 + i * 8 + rand(i + 844) * 13).toFixed(2)}deg`,
      '--stream-length': `${(420 + rand(i + 391) * 820).toFixed(0)}px`,
      '--stream-width': `${(6 + rand(i + 150) * 12).toFixed(0)}px`,
      '--stream-delay': (rand(i + 318) * .2).toFixed(3),
      '--stream-color': colors[i * 3 % colors.length],
    })}"></span>`).join('')

    const particles = Array.from({ length: 504 }, (_, i) => {
      const column = i % 28
      const row = Math.floor(i / 28)
      const x = (column / 27) * 92 - 3 + rand(i + 1) * 6
      const y = (row / 17) * 120 - 32 + rand(i + 514) * 10
      const delay = rand(i + 928) * .33
      const kind = i % 14
      const glyph = kind >= 10 ? symbols[(i + Math.floor(i / 14)) % symbols.length] : ''
      return `<i class="confetti-shape confetti-shape-${kind}" style="${style({
        '--confetti-x': `${x.toFixed(2)}vw`,
        '--confetti-y': `${y.toFixed(2)}vh`,
        '--confetti-spin': `${((i % 2 ? -1 : 1) * (230 + rand(i + 305) * 910)).toFixed(0)}deg`,
        '--confetti-size': (0.62 + rand(i + 709) * .97).toFixed(2),
        '--confetti-delay': delay.toFixed(4),
        '--confetti-speed': (1 / (1 - delay)).toFixed(5),
        '--confetti-color': colors[i % colors.length],
      })}">${glyph}</i>`
    }).join('')

    bg.innerHTML = `
      <span class="background-blob background-blob-one"></span>
      <span class="background-blob background-blob-two"></span>
      <span class="background-blob background-blob-three"></span>
      <div class="gift-glow"></div>
      <div class="gift-light-rays">${rays}</div>
      <div class="gift-color-streams">${streams}</div>
      <div class="confetti-burst">${particles}</div>
      <div class="scroll-gift">
        <span class="gift-surprise gift-surprise-star">✦</span>
        <span class="gift-surprise gift-surprise-heart">♥</span>
        <span class="gift-surprise gift-surprise-dot"></span>
        <span class="gift-surprise gift-surprise-diamond">◆</span>
        <div class="background-gift-lid">
          <span class="background-bow background-bow-left"></span>
          <span class="background-bow background-bow-right"></span>
          <span class="background-bow-knot"></span>
        </div>
        <div class="background-gift-box"><span></span></div>
        <span class="background-ribbon background-ribbon-one"></span>
        <span class="background-ribbon background-ribbon-two"></span>
      </div>
      <span class="background-spark background-spark-one">✦</span>
      <span class="background-spark background-spark-two">✦</span>
      <span class="background-spark background-spark-three">✦</span>
      <span class="background-confetti background-confetti-one"></span>
      <span class="background-confetti background-confetti-two"></span>
      <span class="background-confetti background-confetti-three"></span>`

    const update = () => {
      frame = 0
      const range = Math.max(root.scrollHeight - window.innerHeight, 1)
      const p = clamp(window.scrollY / range)
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      const values = {
        '--enhanced-background-scroll': reduced ? 0 : p,
        '--background-scroll': reduced ? 0 : p,
        '--enhanced-gift-open': reduced ? 0 : smooth(.04, .33, p),
        '--gift-open': reduced ? 0 : smooth(.04, .33, p),
        '--enhanced-rays-progress': reduced ? 0 : smooth(.13, .47, p),
        '--enhanced-streams-progress': reduced ? 0 : smooth(.18, .85, p),
        '--enhanced-rays-opacity': reduced ? 0 : smooth(.12, .23, p) * (1 - smooth(.64, .98, p)),
        '--enhanced-confetti-progress': reduced ? 0 : smooth(.27, 1, p),
        '--enhanced-confetti-opacity': reduced ? 0 : smooth(.27, .41, p),
      }
      Object.entries(values).forEach(([key, value]) => root.style.setProperty(key, value.toFixed(5)))
    }
    const onScroll = () => { if (!frame) frame = window.requestAnimationFrame(update) }
    update()
    window.addEventListener('scroll', onScroll, { passive: true })
    window.addEventListener('resize', onScroll)
    if (typeof ResizeObserver !== 'undefined') {
      const shell = document.querySelector('.app-shell')
      if (shell) new ResizeObserver(onScroll).observe(shell)
    }
    return true
  }

  // React rendert asynchron; erst aktivieren, wenn der Hintergrund vorhanden ist.
  if (!initialize()) {
    const observer = new MutationObserver(() => {
      if (initialize()) observer.disconnect()
    })
    observer.observe(document.documentElement, { childList: true, subtree: true })
  }
})()
</script>

      <script>(() => {
  'use strict';
  const attemptedForms = new WeakSet();
  const toastId = 'gift-form-validation-toast';

  function getFields(form) {
    return {
      age: form.querySelector('.form-section-basics input[type="number"]'),
      budget: form.querySelector('.form-section-basics .input-with-suffix input'),
      interests: form.querySelector('.interest-section'),
      checked: Array.from(form.querySelectorAll('.interest-chip input[type="checkbox"]:checked')),
    };
  }

  function validate(form) {
    const f = getFields(form);
    const errors = [];
    const ageValue = f.age ? f.age.value.trim() : '';
    const ageNumber = Number(ageValue);
    if (!ageValue) {
      errors.push({ field: 'age', text: 'Bitte gib das Alter des Kindes ein.' });
    } else if (!Number.isInteger(ageNumber) || ageNumber < 1 || ageNumber > 17) {
      errors.push({ field: 'age', text: 'Bitte gib ein Alter von 1 bis 17 Jahren ein.' });
    }
    if (f.checked.length < 2 || f.checked.length > 5) {
      errors.push({ field: 'interests', text: 'Bitte wähle 2 bis 5 Interessen aus.' });
    }
    if (f.budget && f.budget.value.trim() !== '') {
      const budget = Number(f.budget.value);
      if (!Number.isFinite(budget) || budget <= 0) {
        errors.push({ field: 'budget', text: 'Bitte gib ein Budget über 0 € ein oder lass das Feld frei.' });
      }
    }
    return { errors, fields: f };
  }

  function dismissToast() {
    const toast = document.getElementById(toastId);
    if (toast) toast.remove();
  }

  function showToast(errors) {
    dismissToast();
    if (!errors.length) return;
    const toast = document.createElement('div');
    toast.id = toastId;
    toast.className = 'validation-toast';
    toast.setAttribute('role', 'alert');
    toast.setAttribute('aria-live', 'assertive');
    const symbol = document.createElement('span');
    symbol.className = 'validation-toast-icon';
    symbol.setAttribute('aria-hidden', 'true');
    symbol.textContent = '!';
    const content = document.createElement('div');
    const title = document.createElement('strong');
    title.textContent = 'Bitte prüfe deine Angaben';
    const description = document.createElement('p');
    description.textContent = errors[0].text + (errors.length === 2 ? ' Außerdem fehlt noch eine Angabe.' : errors.length > 2 ? ` Bitte prüfe ${errors.length - 1} weitere Angaben.` : '');
    content.append(title, description);
    const close = document.createElement('button');
    close.type = 'button';
    close.textContent = '×';
    close.setAttribute('aria-label', 'Hinweis schließen');
    close.addEventListener('click', dismissToast);
    toast.append(symbol, content, close);
    document.body.append(toast);
  }

  function updateHighlights(form, errors) {
    const f = getFields(form);
    for (const key of ['age', 'budget']) {
      if (f[key]) f[key].setAttribute('aria-invalid', String(errors.some((error) => error.field === key)));
    }
    if (f.interests) f.interests.classList.toggle('has-validation-error', errors.some((error) => error.field === 'interests'));
  }

  document.addEventListener('submit', (event) => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement) || !form.matches('.questionnaire') || form.dataset.nativeValidation === 'true') return;
    attemptedForms.add(form);
    const { errors, fields } = validate(form);
    updateHighlights(form, errors);
    showToast(errors);
    if (errors.length) {
      const invalid = fields[errors[0].field];
      requestAnimationFrame(() => {
        if (!invalid) return;
        if (errors[0].field === 'interests') invalid.setAttribute('tabindex', '-1');
        invalid.focus({ preventScroll: true });
        invalid.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth', block: 'center' });
      });
      // React prüft dieselben Werte und zeigt zusätzliche Hinweise direkt am Eingabefeld.
    }
  }, true);

  function updateAfterEdit(event) {
    const form = event.target instanceof Element ? event.target.closest('.questionnaire') : null;
    if (!form || !attemptedForms.has(form) || form.dataset.nativeValidation === 'true') return;
    const { errors } = validate(form);
    updateHighlights(form, errors);
    showToast(errors);
  }
  document.addEventListener('input', updateAfterEdit, true);
  document.addEventListener('change', updateAfterEdit, true);
  document.addEventListener('click', (event) => {
    const form = event.target instanceof Element ? event.target.closest('.questionnaire') : null;
    if (form && event.target.closest('button[type="button"]') && event.target.textContent.includes('zurücksetzen')) {
      attemptedForms.delete(form);
      dismissToast();
    }
  }, true);
})();
</script>
